<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask about Kalkidan Aleme — RAG chatbot</title>
  <meta name="description" content="A $0 RAG chatbot — ask about Kalkidan Aleme's experience, skills, and the products he's built at his studio, Tibeb Labs.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg: #131019; --panel: #1c1826; --line: #2c2639;
      --text: #ece8f6; --dim: #9a90b8; --accent: #7c3aed; --accent-soft: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    #app { display: flex; flex-direction: column; height: 100dvh; }

    .top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid var(--line);
      background: rgba(19,16,25,.85); backdrop-filter: blur(8px);
    }
    .brand { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
    .brand span { color: var(--accent-soft); }
    .gh { color: var(--dim); text-decoration: none; font-size: 13px; }
    .gh:hover { color: var(--text); }

    .scroll { flex: 1; overflow-y: auto; }
    .thread { max-width: 760px; margin: 0 auto; padding: 24px 16px 12px; }

    .hero { text-align: center; padding: 9vh 8px 0; }
    .hero h1 { font-size: clamp(26px, 4.5vw, 40px); line-height: 1.2; margin-bottom: 14px; }
    .hero h1 em { color: var(--accent-soft); font-style: normal; }
    .hero p { color: var(--dim); max-width: 480px; margin: 0 auto 28px; line-height: 1.55; font-size: 15px; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .chip {
      background: var(--panel); color: var(--text); border: 1px solid var(--line);
      border-radius: 999px; padding: 9px 16px; font-size: 13.5px; cursor: pointer;
      transition: border-color .15s, transform .15s;
    }
    .chip:hover { border-color: var(--accent-soft); transform: translateY(-1px); }

    .row { display: flex; gap: 12px; margin: 18px 0; }
    .row.user { justify-content: flex-end; }
    .row.user .body {
      background: var(--accent); color: #fff; border-radius: 18px 18px 4px 18px;
      padding: 11px 16px; max-width: 78%;
    }
    .row.bot .body { max-width: 90%; padding-top: 4px; }
    .avatar {
      flex: 0 0 30px; height: 30px; border-radius: 8px; background: var(--accent);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; margin-top: 2px;
    }
    .text { line-height: 1.65; font-size: 15px; word-wrap: break-word; }
    .text p { margin: 0 0 10px; }
    .text p:last-child, .text ul:last-child { margin-bottom: 0; }
    .text ul { margin: 2px 0 10px 20px; }
    .text li { margin-bottom: 4px; }
    .text a { color: var(--accent-soft); text-underline-offset: 3px; }
    .text a:hover { color: #a78bfa; }
    .text strong { color: #fff; }
    .row.user .text { white-space: pre-wrap; }
    .text.thinking { color: var(--dim); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }
    .sources { display: flex; gap: 6px; margin-top: 10px; }
    .sources span {
      font-size: 11px; color: var(--dim); background: var(--panel);
      border: 1px solid var(--line); border-radius: 8px; padding: 2px 9px;
    }

    .composer { padding: 8px 16px 18px; background: linear-gradient(transparent, var(--bg) 30%); }
    .composer form {
      max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 10px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 24px;
      padding: 8px 8px 8px 18px; transition: border-color .15s;
    }
    .composer form:focus-within { border-color: var(--accent-soft); }
    textarea {
      flex: 1; background: none; border: none; outline: none; resize: none;
      color: var(--text); font: inherit; font-size: 15px; line-height: 1.5; max-height: 160px;
    }
    textarea::placeholder { color: var(--dim); }
    #send {
      flex: 0 0 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--accent); color: #fff; font-size: 17px;
      display: flex; align-items: center; justify-content: center; transition: opacity .15s;
    }
    #send:disabled { opacity: .4; cursor: default; }
    .fine { text-align: center; color: #6f6690; font-size: 12px; margin-top: 10px; }
    .fine a { color: inherit; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="/app.js" defer></script>
</body>
</html>
